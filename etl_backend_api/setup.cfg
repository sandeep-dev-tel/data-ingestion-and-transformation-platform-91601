[flake8]
# Exclude virtual environment and compiled/migration folders
exclude = 
    venv,
    .venv,
    __pycache__,
    migrations,
    .git,
    .init

# Ignore long line warnings for this project to avoid changing provided code and external vendor files
ignore = E501

# Keep the per-file ignores for the Glue job to preserve exact content
per-file-ignores =
    etl_jobs/pi_asset_ingest_glue_job.py: F401,F403
